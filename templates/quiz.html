<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题测验 - GraphRAG</title>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style-new.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/quiz.css') }}">
</head>
<body>
    <div class="quiz-app-layout" id="quizAppLayout">
        <!-- ===== 章节侧边栏 ===== -->
        <aside class="quiz-sidebar" id="quizSidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-mark">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                    </div>
                    <span class="brand-text">刷题测验</span>
                </div>
                <button class="sidebar-collapse-btn" onclick="toggleSidebarCollapse()" title="收起侧边栏">
                    <i class="fas fa-sidebar"></i>
                </button>
            </div>

            <button class="sidebar-all-btn active" onclick="selectChapter('')">
                <i class="fas fa-layer-group"></i>
                <span>全部题目</span>
            </button>

            <div class="sidebar-section-label"><span>教材章节</span></div>
            <div class="chapter-list" id="chapterList">
                <div id="chapterGroups">加载中...</div>
            </div>

            <div class="sidebar-footer">
                <div class="sidebar-stat" id="statDone" title="已做题目">
                    <i class="fas fa-check-double"></i>
                    <span>已做 <strong id="doneCount">0</strong></span>
                </div>
                <div class="sidebar-stat" id="statWrong" title="错题数量">
                    <i class="fas fa-bookmark"></i>
                    <span>错题 <strong id="wrongBadgeSidebar" style="display:none;">0</strong></span>
                </div>
            </div>
        </aside>

        <!-- 侧边栏浮层（移动端） -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>

        <!-- ===== 主内容区 ===== -->
        <main class="quiz-main">
            <header class="quiz-topbar">
                <div class="topbar-left">
                    <button class="btn-icon" id="topbarMenuBtn" onclick="toggleMobileSidebar()" title="目录">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="current-label" id="currentChapterLabel">全部题目</span>
                </div>
                <div class="topbar-right">
                    <a href="/review" class="topbar-btn">
                        <i class="fas fa-brain"></i>
                        <span>复习</span>
                    </a>
                    <a href="/" class="topbar-btn">
                        <i class="fas fa-arrow-left"></i>
                        <span>问答</span>
                    </a>
                </div>
            </header>

            <div class="quiz-content">
                <!-- Tab 切换 -->
                <div class="quiz-tabs">
                    <button class="quiz-tab active" data-tab="quiz" onclick="switchTab('quiz')">
                        <i class="fas fa-pen-to-square"></i> 刷题
                    </button>
                    <button class="quiz-tab" data-tab="exam" onclick="switchTab('exam')">
                        <i class="fas fa-file-alt"></i> 试卷
                    </button>
                    <button class="quiz-tab" data-tab="wrong" onclick="switchTab('wrong')">
                        <i class="fas fa-bookmark"></i> 错题集
                        <span class="tab-badge" id="wrongBadgeTab" style="display:none;">0</span>
                    </button>
                </div>

                <!-- ===== 刷题面板 ===== -->
                <div id="quizPanel">
                    <div class="quiz-filters" id="filterBar">
                        <select id="layerSelect">
                            <option value="">全部层次</option>
                            <option value="物理层">物理层</option>
                            <option value="数据链路层">数据链路层</option>
                            <option value="网络层">网络层</option>
                            <option value="传输层">传输层</option>
                            <option value="应用层">应用层</option>
                        </select>
                        <select id="diffSelect">
                            <option value="">全部难度</option>
                            <option value="basic">基础</option>
                            <option value="medium">中等</option>
                            <option value="hard">困难</option>
                        </select>
                        <button class="btn-start" id="startBtn" onclick="startQuiz()">
                            <i class="fas fa-play"></i> 开始刷题
                        </button>
                    </div>

                    <div class="quiz-score-bar" id="scoreBar" style="display:none;">
                        <div class="score-item">
                            <div class="score-icon"><i class="fas fa-list-ol"></i></div>
                            <div class="score-body">
                                <span class="score-value" id="progressText">0/0</span>
                                <span class="score-label">进度</span>
                            </div>
                        </div>
                        <div class="score-item">
                            <div class="score-icon" style="background:var(--green-soft);"><i class="fas fa-check" style="color:var(--green);"></i></div>
                            <div class="score-body">
                                <span class="score-value score-correct" id="correctCount">0</span>
                                <span class="score-label">正确</span>
                            </div>
                        </div>
                        <div class="score-item">
                            <div class="score-icon" style="background:var(--red-soft);"><i class="fas fa-xmark" style="color:var(--red);"></i></div>
                            <div class="score-body">
                                <span class="score-value score-wrong" id="wrongCount">0</span>
                                <span class="score-label">错误</span>
                            </div>
                        </div>
                        <div class="score-item">
                            <div class="score-icon" style="background:var(--accent-soft);"><i class="fas fa-bullseye" style="color:var(--accent);"></i></div>
                            <div class="score-body">
                                <span class="score-value" id="accuracy">0%</span>
                                <span class="score-label">正确率</span>
                            </div>
                        </div>
                    </div>

                    <div class="quiz-empty" id="emptyState">
                        <div class="empty-icon">
                            <i class="fas fa-circle-question"></i>
                        </div>
                        <p>选择层次、难度和章节，点击「开始刷题」</p>
                        <p class="empty-hint">键盘快捷键：<kbd>A</kbd>-<kbd>D</kbd> 选择选项，<kbd>Enter</kbd> 提交</p>
                    </div>

                    <div class="quiz-card" id="quizCard" style="display:none;">
                        <div class="quiz-progress" id="questionProgress"></div>
                        <div class="quiz-question-text" id="questionText"></div>
                        <div class="options-list" id="optionsList"></div>
                        <div class="quiz-actions">
                            <button class="btn-submit" id="submitBtn" onclick="submitAnswer()" disabled>
                                <i class="fas fa-check"></i> 提交答案
                            </button>
                            <button class="btn-next" id="nextBtn" onclick="nextQuestion()" style="display:none;">
                                下一题 <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                        <div class="quiz-explanation" id="explanationBox"></div>
                    </div>

                    <div class="quiz-complete" id="completePage" style="display:none;">
                        <div class="complete-icon">
                            <i class="fas fa-circle-check"></i>
                        </div>
                        <h2>刷题完成</h2>
                        <p>本轮成绩</p>
                        <div class="final-score">
                            <span id="finalCorrect">0</span>
                            <span class="final-divider">/</span>
                            <span id="finalTotal">0</span>
                        </div>
                        <p class="final-accuracy" id="finalAccuracy"></p>
                        <button class="btn-start" onclick="resetQuiz()">
                            <i class="fas fa-rotate"></i> 再来一轮
                        </button>
                    </div>

                    <!-- 添加题目 -->
                    <div class="quiz-form-section">
                        <button class="form-toggle" onclick="toggleForm()">
                            <i class="fas fa-plus-circle"></i> 添加新题目
                            <i class="fas fa-chevron-down form-toggle-arrow" id="formToggleArrow"></i>
                        </button>
                        <div class="quiz-form" id="addForm">
                            <div class="form-group">
                                <label>题干</label>
                                <textarea id="fText" rows="2" placeholder="输入题目内容"></textarea>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>选项 A</label>
                                    <input id="fA" placeholder="选项 A 内容">
                                </div>
                                <div class="form-group">
                                    <label>选项 B</label>
                                    <input id="fB" placeholder="选项 B 内容">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>选项 C</label>
                                    <input id="fC" placeholder="选项 C 内容">
                                </div>
                                <div class="form-group">
                                    <label>选项 D</label>
                                    <input id="fD" placeholder="选项 D 内容">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>正确答案</label>
                                    <select id="fAnswer">
                                        <option value="A">A</option>
                                        <option value="B">B</option>
                                        <option value="C">C</option>
                                        <option value="D">D</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>难度</label>
                                    <select id="fDiff">
                                        <option value="basic">基础</option>
                                        <option value="medium">中等</option>
                                        <option value="hard">困难</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>所属层次</label>
                                    <select id="fLayer">
                                        <option value="物理层">物理层</option>
                                        <option value="数据链路层">数据链路层</option>
                                        <option value="网络层">网络层</option>
                                        <option value="传输层">传输层</option>
                                        <option value="应用层">应用层</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>所属章节（如 4.2）</label>
                                    <input id="fChapter" placeholder="例如：4.2">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>解析</label>
                                <textarea id="fExplanation" rows="2" placeholder="解释正确答案的原因"></textarea>
                            </div>
                            <button class="btn-add" onclick="addQuestion()">
                                <i class="fas fa-plus"></i> 添加题目
                            </button>
                        </div>
                    </div>
                </div>

                <!-- ===== 错题集面板 ===== -->
                <div id="wrongPanel" style="display:none;">
                    <div class="wrong-actions">
                        <button class="btn-start btn-sm" id="retryAllBtn" onclick="retryWrong()" style="display:none;">
                            <i class="fas fa-rotate"></i> 重做全部错题
                        </button>
                        <button class="btn-ghost-danger" id="clearWrongBtn" onclick="clearWrongList()" style="display:none;">
                            <i class="fas fa-trash-can"></i> 清空错题集
                        </button>
                    </div>
                    <div id="wrongListContainer"></div>
                </div>

                <!-- ===== 试卷面板 ===== -->
                <div id="examPanel" style="display:none;">
                    <!-- 试卷列表视图 -->
                    <div id="examListView">
                        <div id="examPaperList">
                            <div class="exam-empty"><p>加载中...</p></div>
                        </div>
                        <!-- 考试历史 -->
                        <div class="exam-history-section" id="examHistorySection" style="display:none;">
                            <div class="section-title">
                                <i class="fas fa-clock-rotate-left"></i> 考试历史
                            </div>
                            <div class="exam-history-list" id="examHistoryList"></div>
                        </div>
                    </div>

                    <!-- 试卷答题视图 -->
                    <div class="exam-take-view" id="examTakeView">
                        <div class="exam-header">
                            <div class="exam-header-left">
                                <button class="btn-back-exam" onclick="backToExamList()">
                                    <i class="fas fa-arrow-left"></i>
                                </button>
                                <span class="exam-title" id="examTakeTitle">试卷</span>
                            </div>
                            <div class="exam-header-center">
                                <span class="exam-answered-badge" id="examAnsweredBadge">已答 0/30</span>
                                <span class="exam-score-progress" id="examScoreProgress">0/100 分</span>
                            </div>
                            <div class="exam-header-right">
                                <button class="btn-toggle-navigator" onclick="toggleQuestionNav()" title="题目导航">
                                    <i class="fas fa-th"></i>
                                </button>
                                <button class="btn-submit-exam" id="examSubmitBtn" onclick="submitExam()">
                                    <i class="fas fa-check"></i> 交卷
                                </button>
                            </div>
                        </div>

                        <!-- 题目导航浮层 -->
                        <div class="exam-question-nav" id="examQuestionNav" style="display:none;">
                            <div class="exam-nav-header">
                                <span>题目导航</span>
                                <button class="btn-nav-close" onclick="toggleQuestionNav()">
                                    <i class="fas fa-xmark"></i>
                                </button>
                            </div>
                            <div class="exam-nav-legend">
                                <span><span class="nav-dot answered"></span> 已答</span>
                                <span><span class="nav-dot unanswered"></span> 未答</span>
                                <span><span class="nav-dot current"></span> 当前</span>
                            </div>
                            <div class="exam-nav-grid" id="examNavGrid"></div>
                        </div>

                        <div class="exam-question-card" id="examQuestionCard">
                            <div class="exam-q-header">
                                <div class="quiz-progress" id="examQuestionProgress"></div>
                                <div class="exam-question-score" id="examQuestionScore"></div>
                            </div>
                            <div class="quiz-question-text" id="examQuestionText"></div>
                            <div class="options-list" id="examOptionsList"></div>
                            <div class="quiz-actions exam-nav-actions">
                                <button class="btn-nav-arrow" id="examPrevBtn" onclick="examPrevQuestion()" style="visibility:hidden;">
                                    <i class="fas fa-chevron-left"></i> 上一题
                                </button>
                                <button class="btn-nav-arrow btn-nav-next" id="examNextBtn" onclick="examNextQuestion()">
                                    下一题 <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 试卷结果视图 -->
                    <div class="exam-result-view" id="examResultView">
                        <div class="exam-result-score-circle" id="examResultScore"></div>
                        <div class="exam-analysis-card" id="examAnalysisCard" style="display:none;"></div>
                        <div class="exam-error-stats" id="examErrorStats" style="display:none;"></div>
                        <div class="exam-recommendation-actions">
                            <button class="btn-targeted-practice" onclick="startTargetedPractice()">
                                <i class="fas fa-bullseye"></i> 针对性练习
                            </button>
                            <button class="btn-back-to-papers" onclick="backToExamList()">
                                <i class="fas fa-arrow-left"></i> 返回试卷列表
                            </button>
                        </div>
                        <!-- 答题详情 -->
                        <div id="examResultDetails"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast -->
    <div class="quiz-toast" id="toast"></div>

    <script src="{{ url_for('static', path='js/quiz-app.js') }}"></script>
</body>
</html>
